            background: #2a2a2a;
            border-radius: 6px;

            flex-direction: column;
            overflow: hidden;
        }

            background: #1a1a1a;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h2 {
            font-size: 24px;
            color: #fff;
        }

        .header .meta {
            font-size: 12px;
            color: #888;
        }

        .content {
            flex-1;
            overflow-y: auto;
            padding: 30px;
        }

        .section {
            margin-bottom: 30px;
            background: #1a1a1a;
            border-radius: 8px;
            border: 1px solid #333;
            overflow: hidden;
        }

        .section-header {
            padding: 15px 20px;
            background: #252525;
            border-bottom: 1px solid #333;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }

        .section-header:hover {
            background: #2a2a2a;
        }

        .section-header h3 {
            font-size: 16px;
            color: #fff;
        }

        .section-header .toggle {
            font-size: 20px;
            color: #888;
            transition: transform 0.2s;
        }

        .section-header .toggle.collapsed {
            transform: rotate(-90deg);
        }

        .section-content {
            padding: 20px;
            display: none;
        }

        .section-content.expanded {
            display: block;
        }

        .key-value {
            display: flex;
            margin-bottom: 12px;
        }

        .key {
            width: 180px;
            color: #888;
            font-size: 13px;
            flex-shrink: 0;
        }

        .value {
            flex: 1;
            color: #e0e0e0;
            font-size: 13px;
            word-break: break-word;
        }

        .array-item {
            padding: 8px 12px;
            background: #2a2a2a;
            border-radius: 4px;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .nested {
            margin-left: 20px;
            padding-left: 15px;
            border-left: 2px solid #333;
        }

        .code-block {
            background: #0f0f0f;
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.5;
        }

        .tag {
            display: inline-block;
            padding: 4px 8px;
            background: #3a3a3a;
            border-radius: 4px;
            font-size: 11px;
            margin-right: 6px;
            margin-bottom: 6px;
            color: #aaa;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #666;
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

            gap: 20px;
            padding: 20px;
            background: #1a1a1a;
            border-bottom: 1px solid #333;
        }

        .stat-item {

        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #4a9eff;
        }

                </svg>
                <p>Select a context file from the sidebar</p>
            </div>
        </div>
    </div>

    <script>
        let contextFiles = [];

        // Load project list from API
        async function loadProjectList() {
            const list = document.getElementById('projectList');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            try {
                const response = { json: async () => window.CONTEXT_LIST.filter(cf => cf.name.toLowerCase().includes(searchTerm) || cf.description.toLowerCase().includes(searchTerm)) };
                contextFiles = await response.json();
                
                list.innerHTML = '';
                
                contextFiles.forEach(project => {
                    const item = document.createElement('div');
                    item.className = 'project-item';
                    item.dataset.id = project.id;
                    item.innerHTML = `
                        <div class="name">${project.name}</div>
                        <div class="description">${project.description}</div>
                    `;
                    item.onclick = () => loadContext(project);
                    list.appendChild(item);
                });
            } catch (error) {
                list.innerHTML = '<div style="padding: 20px; color: #888;">Error loading contexts: ' + error.message + '</div>';
            }
        }

        // Load context file from API
        async function loadContext(project) {
            // Update active state
            document.querySelectorAll('.project-item').forEach(item => {
                item.classList.remove('active');
                if (item.dataset.id === project.id) {
                    item.classList.add('active');
                }
            });

            // Show header
            document.getElementById('header').style.display = 'flex';
            document.getElementById('stats').style.display = 'flex';

            try {
                const response = { json: async () => window.EMBEDDED_CONTEXTS[project.id] || {} };
                const data = await response.json();

                // Update header
                document.getElementById('projectTitle').textContent = project.name;
                document.getElementById('projectMeta').textContent = `Version: ${data.version || 'N/A'} | Last Updated: ${data.last_updated || 'N/A'}`;

                // Update stats
                document.getElementById('statKeys').textContent = Object.keys(data).length;
                document.getElementById('statSections').textContent = countSections(data);
                document.getElementById('statSize').textContent = formatSize(JSON.stringify(data).length);

                // Render content
                renderContent(data);
            } catch (error) {
                document.getElementById('content').innerHTML = `
                    <div class="empty-state">
                        <p>Error loading context: ${error.message}</p>
                        <p style="font-size: 12px; margin-top: 10px;">ID: ${project.id}</p>
                    </div>
                `;
            }
        }

        function countSections(data) {
            let count = 0;
            for (const key in data) {
                if (typeof data[key] === 'object' && data[key] !== null) {
                    count++;
                }
            }
            return count;
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        function renderContent(data) {
            const content = document.getElementById('content');
            content.innerHTML = '';

            for (const key in data) {
                const section = createSection(key, data[key]);
                content.appendChild(section);
            }
        }

        function createSection(key, value) {
            const section = document.createElement('div');
            section.className = 'section';

            const header = document.createElement('div');
            header.className = 'section-header';
            header.innerHTML = `
                <h3>${formatKey(key)}</h3>
                <span class="toggle collapsed">▼</span>
            `;
            header.onclick = () => toggleSection(section);

            const content = document.createElement('div');
            content.className = 'section-content';
            content.appendChild(renderValue(value));

            section.appendChild(header);
            section.appendChild(content);

            return section;
        }

        function toggleSection(section) {
            const content = section.querySelector('.section-content');
            const toggle = section.querySelector('.toggle');
            
            if (content.classList.contains('expanded')) {
                content.classList.remove('expanded');
                toggle.classList.add('collapsed');
            } else {
                content.classList.add('expanded');
                toggle.classList.remove('collapsed');
            }
        }

        function formatKey(key) {
            return key.replace(/_/g, ' ').replace(/([A-Z])/g, ' $1').trim()
                .replace(/\b\w/g, l => l.toUpperCase());
        }

        function renderValue(value) {
            if (value === null) {
                return document.createTextNode('null');
            }
            
            if (typeof value === 'string') {
                const div = document.createElement('div');
                div.textContent = value;
                return div;
            }
            
            if (typeof value === 'number' || typeof value === 'boolean') {
                const div = document.createElement('div');
                div.textContent = String(value);
                return div;
            }
            
            if (Array.isArray(value)) {
                const div = document.createElement('div');
                value.forEach(item => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'array-item';
                    itemDiv.appendChild(renderValue(item));
                    div.appendChild(itemDiv);
                });
                return div;
            }
            
            if (typeof value === 'object') {
                const div = document.createElement('div');
                div.className = 'nested';
                
                for (const k in value) {
                    const kv = document.createElement('div');
                    kv.className = 'key-value';
                    
                    const keySpan = document.createElement('span');
                    keySpan.className = 'key';
                    keySpan.textContent = formatKey(k) + ':';
                    
                    const valueSpan = document.createElement('span');
                    valueSpan.className = 'value';
                    valueSpan.appendChild(renderValue(value[k]));
                    
                    kv.appendChild(keySpan);
                    kv.appendChild(valueSpan);
                    div.appendChild(kv);
                }
                
                return div;
            }
            
            return document.createTextNode(String(value));
        }

        // Search functionality
        document.getElementById('searchInput').addEventListener('input', loadProjectList);

        // Initialize
        loadProjectList();

        // Check URL param for direct context loading
        const urlParams = new URLSearchParams(window.location.search);
        const contextId = urlParams.get('context');
        if (contextId) {
            // Wait for project list to load, then select context
            setTimeout(() => {
                const project = contextFiles.find(p => p.id === contextId);
                if (project) {
                    loadContext(project);
                }
            }, 500);
        }
    </script>
</body>
</html>
